---
argument_specs:
  main:
    short_description: Deploy Arcane, a modern web UI for managing Docker containers, via Docker Compose.
    description:
      - Renders a docker-compose.yml under /opt/docker/arcane and brings up the Arcane web UI together with its PostgreSQL backing store.
      - Configures Traefik labels for HTTPS access on the configured hostname and joins the external proxy_network.
    author:
      - Dan Wallace
    options:
      arcane_deploy:
        description: When false, render /opt/docker/arcane/docker-compose.yml without starting or restarting the stack (used by molecule).
        type: bool
        default: true
      arcane_hostname:
        description: Public hostname the Arcane web UI is served on; used for ARCANE_APP_URL and the Traefik Host rule.
        type: str
        required: true
      arcane_version:
        description:
          - Image tag for ghcr.io/getarcaneapp/manager. Must be v3.0.0 or newer; the role renders a 3.x-only compose file.
          - Upgrading from 2.x requires running v2.17.3 once first (see the README).
        type: str
        required: false
        default: v3.1.1
      arcane_postgres_version:
        description: Image tag for postgres (pinned to a patch release; the same pin as danmwallace.podman.arcane).
        type: str
        required: false
        default: 17.11-alpine
      arcane_socket_proxy_version:
        description:
          - Image reference after ghcr.io/tecnativa/docker-socket-proxy, used to safely expose the Docker socket to Arcane.
          - Either a tag, or a tag plus its digest (tag@sha256:...). The default pins the floating 3.4 tag to its multi-arch index digest.
        type: str
        required: false
        default: "3.4@sha256:027f9fa5ee70be5836eeaa10ce889d7a83f34a8db16a7f412818b92997e0beab"
      arcane_encryption_key:
        description:
          - Encryption key used by Arcane (ARCANE_ENCRYPTION_KEY), supplied from vault.
          - "At least 32 characters, or a hex: or base64: encoded 32-byte key; Arcane 3.x refuses shorter passphrases."
          - Keep the value used under 2.x, or Arcane cannot decrypt its stored secrets.
        type: str
        required: true
      arcane_jwt_secret:
        description:
          - Deprecated and ignored. Arcane 3.x signs sessions with its own key and no longer reads JWT_SECRET.
          - Accepted so existing inventories keep working; it will be removed in a later major release.
        type: str
        required: false
      arcane_postgres_db:
        description: PostgreSQL database name for Arcane.
        type: str
        required: false
        default: arcane
      arcane_postgres_user:
        description: PostgreSQL user name for Arcane.
        type: str
        required: false
        default: arcane
      arcane_postgres_password:
        description: PostgreSQL password for the Arcane user. Should be supplied from vault.
        type: str
        required: true
      arcane_database_url:
        description: Full PostgreSQL connection URL used by Arcane. Defaults to the bundled arcane-postgres service.
        type: str
        required: false
        default: "postgresql://arcane:{{ arcane_postgres_password }}@arcane-postgres:5432/arcane"
