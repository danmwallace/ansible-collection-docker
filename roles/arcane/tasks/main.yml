---
# tasks file for arcane

- name: Assert required arcane secrets are set
  ansible.builtin.assert:
    that:
      - arcane_postgres_password is defined
      - arcane_postgres_password | length >= 12
      - arcane_encryption_key is defined
      - arcane_encryption_key | length >= 16
      - arcane_jwt_secret is defined
      - arcane_jwt_secret | length >= 16
    fail_msg: "arcane_postgres_password (min 12 chars), arcane_encryption_key (min 16 chars), and arcane_jwt_secret (min 16 chars) must be set from vault."

- name: Ensure arcane directory exists
  ansible.builtin.file:
    path: /opt/docker/arcane
    state: directory
    mode: "0755"
  become: true

- name: Render arcane docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/docker/arcane/docker-compose.yml
    mode: "0600"
  become: true
  notify: Restart arcane compose project

- name: Deploy arcane via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/docker/arcane/
    files:
      - docker-compose.yml
    state: present
  become: true
