---
# tasks file for arcane

- name: Assert arcane_version is a 3.x release
  ansible.builtin.assert:
    that:
      - arcane_version | regex_replace('^v', '') is version('3.0.0', '>=')
    # A 2.x image would ignore every ARCANE_ name and start on an empty SQLite DB.
    fail_msg: >-
      arcane_version {{ arcane_version }} is older than v3.0.0. This role renders a
      3.x-only compose file; use collection 1.4.x to run Arcane 2.x.

- name: Assert required arcane secrets are set
  ansible.builtin.assert:
    that:
      - arcane_postgres_password is defined
      - arcane_postgres_password | length >= 12
      - arcane_encryption_key is defined
      # Arcane 3.x refuses a passphrase under 32 characters in production.
      - >-
        arcane_encryption_key is match('^(hex|base64):')
        or (arcane_encryption_key | regex_replace('^raw:', '') | length >= 32)
    fail_msg: >-
      arcane_postgres_password (min 12 chars) and arcane_encryption_key (min 32 chars,
      or a hex:/base64: encoded 32-byte key) must be set from vault.

- name: Ensure arcane directory exists
  ansible.builtin.file:
    path: /opt/docker/arcane
    state: directory
    mode: "0755"
  become: true

- name: Render arcane docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/docker/arcane/docker-compose.yml
    mode: "0600"
  become: true

# No restart handler: `up` already recreates exactly the services whose config
# changed. A `state: restarted` handler on top of it restarted every container a
# second time, Postgres included, under the freshly recreated Arcane, which then
# waited ~2.5 min for its stale actor-host registration to expire (#77).
#
# Arcane's backing services come up first, and Arcane only once Postgres
# accepts connections, so a recreated Arcane never races the database.
- name: Ensure arcane-postgres and socket-proxy are up
  community.docker.docker_compose_v2:
    project_src: /opt/docker/arcane/
    files:
      - docker-compose.yml
    services:
      - arcane-postgres
      - socket-proxy
    state: present
  become: true
  when: arcane_deploy | bool

# TCP, not the Unix socket: during first-run initdb the entrypoint's temporary
# server listens only on the socket, so a socket check would pass too early.
- name: Ensure arcane-postgres accepts connections before Arcane starts
  community.docker.docker_container_exec:
    container: arcane-postgres
    argv:
      - pg_isready
      - --host=127.0.0.1
      - --port=5432
      - --username={{ arcane_postgres_user }}
      - --dbname={{ arcane_postgres_db }}
  become: true
  register: arcane_postgres_ready
  until: arcane_postgres_ready.rc | default(1) == 0
  retries: 30
  delay: 2
  changed_when: false
  when:
    - arcane_deploy | bool
    - not ansible_check_mode

- name: Deploy arcane via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/docker/arcane/
    files:
      - docker-compose.yml
    state: present
  become: true
  when: arcane_deploy | bool
