---
- name: Create molecule instance
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Start librechat-instance container
      containers.podman.podman_container:
        name: librechat-instance
        image: docker.io/jrei/systemd-ubuntu:noble
        state: started
        command: /sbin/init
        privileged: true
        systemd: always
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
        cgroupns: host

- name: Prepare molecule instance
  hosts: molecule
  gather_facts: true
  vars:
    # The ansible user does not exist yet; play vars outrank the inventory's ansible_user.
    ansible_user: root
  tasks:
    - name: Ensure docker group exists (role tasks chown files to it)
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ensure ansible user exists (role tasks chown files to it)
      ansible.builtin.user:
        name: ansible
        group: docker
        state: present

    # The role clones LibreChat with ansible.builtin.git but leaves installing git to the
    # common role (common_packages_debian); the minimal test image has neither git nor sudo.
    - name: Ensure git and sudo are installed, as the common role leaves them on real hosts
      ansible.builtin.apt:
        name:
          - git
          - sudo
        state: present
        update_cache: true

    - name: Ensure the ansible user has passwordless sudo, as the common role grants
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        owner: root
        group: root
        validate: visudo -cf %s
