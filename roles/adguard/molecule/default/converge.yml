---
- name: Converge
  hosts: molecule
  gather_facts: true
  tasks:
    - name: Apply adguard role with test values
      ansible.builtin.include_role:
        name: danmwallace.docker.adguard
      vars:
        adguard_deploy: false  # no Docker in the test container; verify checks the rendered files
        adguard_hostname: adguard.test.local
