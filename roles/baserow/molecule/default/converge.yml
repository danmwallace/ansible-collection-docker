---
- name: Converge
  hosts: molecule
  gather_facts: true
  tasks:
    - name: Apply baserow role with test values
      ansible.builtin.include_role:
        name: danmwallace.docker.baserow
      vars:
        baserow_deploy: false  # no Docker in the test container; verify checks the rendered files
        baserow_hostname: baserow.test.local
