---
# tasks file for n8n

- name: Assert required n8n secrets are set
  ansible.builtin.assert:
    that:
      - n8n_encryption_key is defined
      - n8n_encryption_key | length >= 16
      - n8n_postgres_password is defined
      - n8n_postgres_password | length >= 12
    fail_msg: "n8n_encryption_key (min 16 chars) and n8n_postgres_password (min 12 chars) must be set from vault."

- name: Create /opt/docker/n8n directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ansible
    group: docker
    mode: "0755"
  become: true
  loop:
    - /opt/docker/n8n
    - /opt/docker/n8n/local-files
    - /opt/docker/n8n/volumes/postgres-db
    - /opt/docker/n8n/volumes/n8n

- name: Render n8n docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/docker/n8n/docker-compose.yml
    owner: ansible
    group: docker
    mode: "0600"
  become: true
  notify: Restart n8n compose project

- name: Deploy n8n via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/docker/n8n/
    files:
      - docker-compose.yml
    state: present
    pull: always
  become: true
