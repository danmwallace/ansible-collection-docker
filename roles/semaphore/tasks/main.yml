---
# tasks file for semaphore

- name: Assert required semaphore secrets are set
  ansible.builtin.assert:
    that:
      - semaphore_postgres_password is defined
      - semaphore_postgres_password | length >= 12
      - semaphore_admin_password is defined
      - semaphore_admin_password | length >= 12
    fail_msg: "semaphore_postgres_password (min 12 chars) and semaphore_admin_password (min 12 chars) must be set from vault."

- name: Ensure /opt/docker/semaphore directory exists
  ansible.builtin.file:
    path: /opt/docker/semaphore
    state: directory
    mode: "0755"
  become: true

- name: Render semaphore docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/docker/semaphore/docker-compose.yml
    mode: "0600"
  become: true
  notify: Restart semaphore compose project

- name: Deploy semaphore via docker compose
  community.docker.docker_compose_v2:
    project_src: /opt/docker/semaphore/
    files:
      - docker-compose.yml
    state: present
  become: true
