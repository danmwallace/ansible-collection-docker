---
- name: Create molecule instance
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Start common-instance container
      containers.podman.podman_container:
        name: common-instance
        image: docker.io/jrei/systemd-ubuntu:noble
        hostname: common-instance
        state: started
        command: /sbin/init
        privileged: true
        systemd: always
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
        cgroupns: host

- name: Prepare molecule instance
  hosts: molecule
  gather_facts: false
  tasks:
    # Stock Ubuntu Server ships sudo; the minimal test image does not, and the role
    # writes /etc/sudoers.d/ansible (validated with visudo) without installing it.
    - name: Ensure sudo is installed, as on a stock Ubuntu Server
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true
