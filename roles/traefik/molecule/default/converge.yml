---
- name: Converge
  hosts: molecule
  gather_facts: true
  tasks:
    - name: Apply traefik role with test values
      ansible.builtin.include_role:
        name: danmwallace.docker.traefik
      vars:
        traefik_deploy: false  # no Docker in the test container; verify checks the rendered files
        traefik_hostname: traefik.test.local
        traefik_cloudflare_api_token: test-cloudflare-token # molecule-test-only: fake value, not a real credential
        traefik_cloudflare_email: test@test.local
