---
argument_specs:
  main:
    short_description: Deploy Traefik reverse proxy with automatic SSL via Let's Encrypt and Cloudflare DNS-01.
    description:
      - Renders Traefik's docker-compose.yml plus static (traefik.yml) and dynamic (dynamic_conf.yml) configuration into /opt/docker/traefik, creates the
        external proxy_network Docker network, touches acme.json with 0600 permissions, and brings the stack up with docker_compose_v2.
      - Configures the cloudflare ACME resolver for DNS-01 wildcard certs; the Traefik dashboard is exposed via a Traefik router on the supplied hostname.
    author:
      - Dan Wallace
    options:
      traefik_deploy:
        description: When false, render the compose project and its config without starting or restarting the stack (used by molecule).
        type: bool
        default: true
      traefik_hostname:
        description: Public hostname Traefik routes to its own dashboard (api@internal).
        type: str
        required: true
      traefik_cloudflare_api_token:
        description: Cloudflare API token with Zone.DNS edit rights, used for the DNS-01 challenge. Supply from vault.
        type: str
        required: true
      traefik_cloudflare_email:
        description: Email address Let's Encrypt associates with issued certificates and Cloudflare's CF_API_EMAIL.
        type: str
        required: true
      traefik_version:
        description: Image tag for the traefik image.
        type: str
        required: false
        default: v3.7.19
      traefik_https_bind_address:
        description:
          - IP address the HTTPS ingress port (443) is bound to.
          - Defaults to 0.0.0.0 (all interfaces), which is the expected behaviour for a public reverse proxy.
          - Override to a specific interface IP on dual-homed hosts to restrict which interface accepts inbound HTTPS.
          - An empty string publishes 443 without an address, Docker's default of every IPv4 and IPv6 interface.
        type: str
        required: false
        default: "0.0.0.0"
      traefik_dashboard_local_port:
        description:
          - Publish the plain dashboard entrypoint (:8081) on 127.0.0.1:8081 and pass the matching command-line flags.
        type: bool
        required: false
        default: true
      traefik_dashboard_via_hostname:
        description:
          - Attach the traefik router (Host traefik_hostname) to the dashboard service api@internal.
          - The role adds no auth or IP allowlist middleware; set false where that hostname is reachable by anyone who should not see the dashboard.
        type: bool
        required: false
        default: true
      traefik_extra_env:
        description:
          - Extra environment variables for the Traefik container, as a NAME/value dict, rendered in sorted order.
          - Values are rendered verbatim in compose list syntax; do not quote them. Example LEGO_DISABLE_CNAME_SUPPORT=true for the lego Cloudflare provider.
        type: dict
        required: false
        default: {}
