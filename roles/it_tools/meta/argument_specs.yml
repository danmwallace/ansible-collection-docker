---
argument_specs:
  main:
    short_description: Deploy IT-Tools developer utility suite in Docker behind Traefik via Docker Compose.
    description:
      - Creates /opt/docker/it-tools, renders a docker-compose.yml that runs corentinth/it-tools:{{ it_tools_version }} on the external
        proxy_network, and brings the stack up with community.docker.docker_compose_v2; a handler restarts the project when the compose file changes.
      - The web UI is routed by Traefik on the supplied hostname over the websecure entrypoint, and is also published directly on host port 8079
        (bound to it_tools_bind_address, loopback by default).
    author:
      - Dan Wallace
    options:
      it_tools_hostname:
        description: Public hostname Traefik routes to the IT-Tools web UI.
        type: str
        required: false
        default: it-tools.example.com
      it_tools_bind_address:
        description:
          - IP address the direct host port 8079 is bound to.
          - Defaults to 127.0.0.1 so the port is not exposed on all interfaces.
          - Set to "0.0.0.0" only if Traefik-bypass LAN access is intentionally required.
        type: str
        required: false
        default: "127.0.0.1"
      it_tools_version:
        description:
          - Tag of the corentinth/it-tools image to deploy. Pin to a specific release for reproducibility.
          - Upstream tags are "<date>-<short sha>"; see https://hub.docker.com/r/corentinth/it-tools/tags.
        type: str
        required: false
        default: "2024.10.22-7ca5933"
